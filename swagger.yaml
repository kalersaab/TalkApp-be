swagger: '2.0'
info:
  title: TalkApp REST API
  version: '1.0.0'
  description: TalkApp API documentation

schemes:
  - https
  - http

consumes:
  - application/json

produces:
  - application/json

tags:
  - name: auth
    description: Authentication API
  - name: users
    description: Users API

paths:
  # [POST] /signup
  /signup:
    post:
      tags:
        - auth
      summary: Sign Up
      parameters:
        - name: body
          in: body
          description: User credentials
          required: true
          schema:
            $ref: '#/definitions/CreateUser'
      responses:
        201:
          description: Created
        400:
          description: Bad Request
        409:
          description: Conflict (email already exists)
        500:
          description: Server Error

  # [POST] /login
  /login:
    post:
      tags:
        - auth
      summary: Log In
      parameters:
        - name: body
          in: body
          description: User credentials
          required: true
          schema:
            $ref: '#/definitions/CreateUser'
      responses:
        200:
          description: OK
        400:
          description: Bad Request
        409:
          description: Conflict
        500:
          description: Server Error

  # [POST] /logout
  /logout:
    post:
      tags:
        - auth
      summary: Log Out
      security:
        - cookieAuth: []
      responses:
        200:
          description: OK
        401:
          description: Unauthorized
        500:
          description: Server Error

  # [GET] /users
  /users:
    get:
      tags:
        - users
      summary: Find All Users
      security:
        - cookieAuth: []
      parameters:
        - name: isActive
          in: query
          description: Filter by active status
          required: false
          type: boolean
        - name: keyword
          in: query
          description: Search keyword
          required: false
          type: string
        - name: name
          in: query
          description: Filter by name
          required: false
          type: string
        - name: email
          in: query
          description: Filter by email
          required: false
          type: string
        - name: page
          in: query
          description: Page number
          required: false
          type: string
        - name: limit
          in: query
          description: Items per page
          required: false
          type: string
      responses:
        200:
          description: OK
        401:
          description: Unauthorized
        500:
          description: Server Error

    post:
      tags:
        - users
      summary: Create User
      parameters:
        - name: body
          in: body
          description: User data
          required: true
          schema:
            $ref: '#/definitions/CreateUser'
      responses:
        201:
          description: Created
        400:
          description: Bad Request
        409:
          description: Conflict (email already exists)
        500:
          description: Server Error

  # [POST] /users/verify-email
  /users/verify-email:
    post:
      tags:
        - users
      summary: Verify User Email via OTP
      parameters:
        - name: body
          in: body
          description: Email and OTP code
          required: true
          schema:
            $ref: '#/definitions/VerifyUser'
      responses:
        200:
          description: OK
        400:
          description: Bad Request
        500:
          description: Server Error

  # [POST] /users/resend-otp
  /users/resend-otp:
    post:
      tags:
        - users
      summary: Resend OTP to Email
      parameters:
        - name: body
          in: body
          description: User email
          required: true
          schema:
            $ref: '#/definitions/ResendOtp'
      responses:
        200:
          description: OK
        400:
          description: Bad Request
        500:
          description: Server Error

  # [GET] /users/{id}
  /users/{id}:
    get:
      tags:
        - users
      summary: Find User By Id
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          description: User Id
          required: true
          type: string
      responses:
        200:
          description: OK
        401:
          description: Unauthorized
        409:
          description: Conflict
        500:
          description: Server Error

    put:
      tags:
        - users
      summary: Update User By Id
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          description: User Id
          required: true
          type: string
        - name: body
          in: body
          description: Updated user data
          required: true
          schema:
            $ref: '#/definitions/UpdateUser'
      responses:
        200:
          description: OK
        400:
          description: Bad Request
        401:
          description: Unauthorized
        409:
          description: Conflict
        500:
          description: Server Error

    delete:
      tags:
        - users
      summary: Delete User By Id
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          description: User Id
          required: true
          type: string
      responses:
        200:
          description: OK
        401:
          description: Unauthorized
        409:
          description: Conflict
        500:
          description: Server Error

# definitions
definitions:
  CreateUser:
    type: object
    required:
      - email
      - password
      - name
      - role
    properties:
      email:
        type: string
        description: User email address
        example: user@example.com
      password:
        type: string
        description: Password (6–32 characters)
        minLength: 6
        maxLength: 32
        example: secret123
      name:
        type: string
        description: Display name
        example: John Doe
      role:
        type: string
        description: User role
        example: user
      firstName:
        type: string
        description: First name (optional)
        example: John
      lastName:
        type: string
        description: Last name (optional)
        example: Doe

  UpdateUser:
    type: object
    properties:
      name:
        type: string
        description: Display name (2–32 characters)
        minLength: 2
        maxLength: 32
        example: Jane Doe
      email:
        type: string
        description: Email address
        example: jane@example.com
      password:
        type: string
        description: New password (6–32 characters)
        minLength: 6
        maxLength: 32
        example: newpassword123

  VerifyUser:
    type: object
    required:
      - email
      - otp
    properties:
      email:
        type: string
        description: User email address
        example: user@example.com
      otp:
        type: string
        description: OTP code (4–6 characters)
        minLength: 4
        maxLength: 6
        example: '123456'

  ResendOtp:
    type: object
    required:
      - email
    properties:
      email:
        type: string
        description: User email address
        example: user@example.com

securityDefinitions:
  cookieAuth:
    type: apiKey
    in: header
    name: Authorization
